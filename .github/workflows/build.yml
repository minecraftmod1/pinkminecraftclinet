name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Build jar
        run: gradle build --no-daemon -Dorg.gradle.jvmargs=-Xmx3g

      - uses: actions/upload-artifact@v4
        with:
          name: item-outline-jar
          path: build/libs/item-outline-*.jar
